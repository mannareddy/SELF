body{

  /* ── SHARED TABLE STYLES)
.self-table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  border:1px solid #1e1e1e;
  margin:0 auto;
  position:relative;
  max-width:100%;
  touch-action:pan-x pan-y;  /* ADD THIS LINE */}
.self-table{
  width:100%;
  border-collapse:collapse;
}
.self-table th{
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--dim);
  background:#0a0a0a;
  padding:14px 10px;
  border-right:1px solid #1a1a1a;
  border-bottom:1px solid #1a1a1a;
  text-align:center;
  vertical-align:middle;
  line-height:1.5;
  white-space:nowrap;
}
.self-table th .sub{
  display:block;
  font-size:8px;
  letter-spacing:1px;
  opacity:.65;
  font-weight:400;
  margin-top:3px;
  text-transform:none;
  white-space:nowrap;
}
.self-table th:last-child{border-right:none;}
.self-table td{
  font-family:var(--serif);
  font-size:14px;
  font-weight:300;
  color:var(--grey);
  padding:14px 10px;
  border-right:1px solid #1a1a1a;
  border-bottom:1px solid #1a1a1a;
  text-align:center;
  vertical-align:middle;
  line-height:1.65;
}
.self-table td:last-child{border-right:none;}
.self-table tr:last-child td{border-bottom:none;}
.self-table td.row-label{
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--dim);
  white-space:nowrap;
  text-align:center;
}
.self-table td.gold{color:var(--gold);}
.self-table td.bright{color:var(--white);font-weight:400;}
.self-table td.red{color:#c0392b;font-style:italic;}
.self-table tr.gold-row{background:rgba(212,175,55,.04);}
.self-table tr.gold-row td{border-left:3px solid var(--gold);}
.self-table tr.gold-row td:not(:first-child){border-left:1px solid #1a1a1a;}

[data-theme="light"] .dark-night-card p { color:#2e2008 !important; font-weight:400 !important; }
[data-theme="light"] .gratitude-card p  { color:#2e2008 !important; font-weight:400 !important; }
a{color:var(--gold);text-decoration:none;transition:opacity .25s;}
a:hover{opacity:.7;}
/* Default OS tier cards */
[data-theme="light"] [style*="background:rgba(192,57,43,.06)"]{background:rgba(192,57,43,.08) !important;}
[data-theme="light"] [style*="border:1px solid #3a1010"]{border-color:rgba(192,57,43,.3) !important;}
[data-theme="light"] [style*="background:rgba(212,175,55,.05)"][style*="border:1px solid var(--gold)"]{background:rgba(138,106,18,.08) !important;}
/* ── FOUR THEORIES TABLE — LIGHT THEME HEADER FIX ───────────────────────── */
[data-theme="light"] [style*="grid-template-columns:1.4fr 1fr 1fr 1fr"] > div[style*="background:#0a0a0a"] > div {
  color: #3a2a0a !important;
  font-weight: 600 !important;
}
/* ── STICKY NAV — centered logo, items split left/right ─────────────────── */
.site-nav{
  position:fixed;top:0;left:0;right:0;z-index:999;height:var(--nav-h);
  display:flex;align-items:center;
  background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid #1c1c1c;transition:background .3s;
  overflow-x:clip;
  will-change:auto;
  -webkit-backface-visibility:visible;
  backface-visibility:visible;
}
.site-nav::-webkit-scrollbar{display:none;}
.site-nav{scrollbar-width:none;}
.site-nav.scrolled{background:rgba(0,0,0,0.98);}
.progress-bar{position:absolute;bottom:0;left:0;height:2px;width:0%;background:linear-gradient(90deg,rgba(212,175,55,.4) 0%,var(--gold) 100%);transition:width .1s linear;pointer-events:none;}

/* Nav left / right halves */
.nav-left,.nav-right{display:flex;align-items:center;height:var(--nav-h);list-style:none;margin:0;padding:0;flex:1;}
.nav-left{
    justify-content:space-evenly;
}

.nav-right{
    justify-content:space-evenly;
}

@media(max-width:900px){
  .nav-left{justify-content:flex-start; flex:0 !important;}
  .nav-right{justify-content:flex-start; flex:0 !important; padding-right:0 !important;}
}
.nav-left li a,
.nav-right li a{
    display:flex;
    align-items:center;
    justify-content:center;
    .nav-left li,
    .nav-right li{
    flex:1;
} 
    min-width:auto;
    width:100%;

    font-family:var(--sans);
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;

    color:var(--dim);

    padding:0 16px;

    height:var(--nav-h);
    line-height:var(--nav-h);

    transition:color .2s;

    border-right:1px solid #1a1a1a;

    white-space:nowrap;
}

.nav-left li:first-child a{border-left:1px solid #1a1a1a;}
.nav-right li a:hover,.nav-left li a:hover{color:var(--gold);opacity:1;}
.nav-right li a.active,.nav-left li a.active{color:var(--gold);}

/* Center logo */
.nav-logo-center{
  display:flex;align-items:center;justify-content:center;
  width:56px;height:50px;border-radius:5px;overflow:hidden;
  border:1px solid rgba(212,175,55,0.5);
  box-shadow:0 0 12px 4px rgba(212,175,55,0.45),0 0 28px 8px rgba(212,175,55,0.2);
  margin:0 6px;animation:navLogoGlow 3s ease-in-out infinite;flex-shrink:0;
  text-decoration:none;
}
.nav-logo-center img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes navLogoGlow{
  0%,100%{opacity:0.85;}
  50%{opacity:1;}
}

/* Theme button pinned to right edge */
#themeToggleBtn{
  position:absolute;right:0;top:0;background:rgba(0,0,0,.92);
  border:none;border-left:1px solid #1a1a1a;color:var(--dim);cursor:pointer;
  width:44px;height:var(--nav-h);display:flex;align-items:center;justify-content:center;
  font-size:14px;z-index:2;transition:color .2s;padding:0;
}
#themeToggleBtn:hover{color:var(--gold);}
/* Reserve space so nav items don't go under theme button */
.nav-right{padding-right:44px;}

/* Mobile nav */
@media(max-width:900px){
.site-nav{overflow-x:scroll;scrollbar-width:none;white-space:nowrap;touch-action:pan-x;}
  .nav-left{justify-content:flex-start; flex:0 !important;}
  .nav-right{justify-content:flex-start; flex:0 !important; padding-right:0 !important;}
  .nav-left li,.nav-right li{flex:0 !important; width:auto !important;}
  .nav-left li a,.nav-right li a{font-size:8px;letter-spacing:0.5px;padding:0 5px;min-width:auto;width:auto !important;}
  .nav-left li:first-child a{border-left:none;}
  .nav-hide-mobile{display:none !important; visibility:hidden; width:0; overflow:hidden; border:none; margin:0; padding:0;}
  .nav-icon-item{display:list-item !important;}
  .nav-icon-item button{
  background:none !important;
  border:none !important;
  border-left:1px solid #1a1a1a !important;
  color:var(--dim) !important;
  cursor:pointer !important;
  width:40px !important;
  height:var(--nav-h) !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  font-size:14px !important;
  padding:0 !important;
  transition:color .2s !important;
  flex-shrink:0 !important;
}

.nav-icon-item button:hover{
  color:var(--gold) !important;
}
  #themeToggleBtn{display:none !important;} 
}
@media(max-width:480px){
.nav-left li a,.nav-right li a{
    font-size:8px;
    letter-spacing:0.8px;
    padding:0 8px;
}
  .nav-logo-center{width:40px;height:40px;margin:0 1px;}
}

/* ── GEO BADGE ───────────────────────────────────────────────────────────── */
.geo-badge{position:fixed;bottom:18px;right:20px;z-index:900;font-family:var(--sans);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border:1px solid #2a2a2a;padding:5px 10px;background:rgba(0,0,0,.92);opacity:0;transition:opacity .6s ease;pointer-events:none;}
.geo-badge.visible{opacity:1;}

/* ── UTILITIES ───────────────────────────────────────────────────────────── */
.section{padding:80px 24px;max-width:660px;margin:0 auto;scroll-margin-top:56px;}
.section-wide{scroll-margin-top:56px;padding:80px 24px;max-width:980px;margin:0 auto;}
section{scroll-margin-top:56px;}
.divider{width:1px;height:70px;background:linear-gradient(to bottom,transparent,#2a2a2a,transparent);margin:0 auto;}
.gold-line{width:48px;height:1px;background:var(--gold);opacity:.45;margin:44px auto;}
.label{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--gold);opacity:.85;margin-bottom:42px;display:block;}

/* ── COLLAPSE TOGGLE BUTTON ──────────────────────────────────────────────── */
.collapse-toggle-btn{font-family:var(--sans);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);background:transparent;border:1px solid rgba(212,175,55,0.5);padding:10px 28px;cursor:pointer;transition:all .3s;opacity:.85;display:inline-block;margin-bottom:8px;}
.collapse-toggle-btn:hover{opacity:1;border-color:var(--gold);background:rgba(212,175,55,0.06);}
.section-collapse-label{font-family:var(--sans);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-top:8px;margin-bottom:0;display:block;}
.section-collapse-wrap{overflow:hidden;transition:max-height .55s cubic-bezier(0,1,.25,1),opacity .35s ease;opacity:1;}
.section-collapse-wrap.collapsed{max-height:0 !important;opacity:0;}

/* ── THEME TOGGLE (hidden on mobile, shown by nav-icon-item) ─────────────── */
.nav-icon-item{display:none !important;}

/* ── HERO ─────────────────────────────────────────────────────────────────── */
.hero{min-height:calc(100vh - var(--nav-h));display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px 24px 0;position:relative;background:radial-gradient(ellipse at 50% 35%,rgba(212,175,55,.05) 0%,transparent 68%);}
.hero-question{font-size:clamp(15px,2vw,22px);font-weight:300;font-style:italic;color:var(--gold);line-height:1.45;max-width:620px;margin-bottom:10px;letter-spacing:.3px;text-align:center;}
.hero-sub{font-size:clamp(15px,2vw,18px);color:var(--mid);font-weight:300;max-width:480px;line-height:1.85;margin-bottom:8px;}
.expand-label{display:inline-block;font-family:var(--sans);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(212,175,55,.3);padding:4px 12px;margin-left:12px;transition:border-color .25s;vertical-align:middle;}
.btn-gold{padding:14px 44px;background:var(--gold);color:#000;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .25s,transform .2s;text-decoration:none;display:inline-block;box-shadow:0 0 20px rgba(212,175,55,.3);}
.btn-gold:hover{opacity:.9;color:#000;transform:scale(1.05);}
.btn-outline{padding:12px 28px;background:transparent;border:1px solid #444;color:var(--mid);font-family:var(--sans);font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .25s;display:inline-block;text-decoration:none;}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-outline:disabled{opacity:.5;cursor:default;}
@keyframes fade{0%,100%{opacity:0;}50%{opacity:1;}}
.continue-hint{display:block;text-align:center;padding:28px 0 8px;font-family:var(--sans);font-size:10px;color:#444;letter-spacing:4px;text-transform:uppercase;animation:fade 3.5s ease-in-out infinite;user-select:none;pointer-events:none;}
.continue-hint::after{content:'↓';display:block;font-size:16px;margin-top:4px;letter-spacing:0;}

/* ── BANNER ──────────────────────────────────────────────────────────────── */
.banner-section{max-width:1400px;margin:0 auto;}
.banner-image{width:100%;height:auto;display:block;border-top:1px solid #111;border-bottom:1px solid #111;}

/* ── PHIL LINES ──────────────────────────────────────────────────────────── */
.phil-line{font-size:clamp(18px,2.8vw,26px);font-weight:300;color:var(--mid);line-height:1.9;margin:14px 0;}
.phil-line.gold{color:var(--gold);font-style:italic;}
.phil-line.dim{color:var(--grey);font-size:clamp(16px,2.1vw,21px);}
.phil-line.bright{color:var(--white);}

/* ── PULL-QUOTE ──────────────────────────────────────────────────────────── */
.pull-quote{max-width:680px;margin:56px auto;padding:36px 0 36px 32px;border-left:3px solid var(--gold);text-align:left;position:relative;}
.pull-quote p{font-family:var(--serif);font-size:clamp(20px,3vw,29px);font-weight:300;font-style:italic;color:var(--white);line-height:1.65;margin:0;}
.pull-quote cite{display:block;margin-top:14px;font-family:var(--sans);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-style:normal;opacity:.75;}

/* ── COSMO-QUOTE ─────────────────────────────────────────────────────────── */
.cosmo-quote{max-width:660px;margin:44px auto;padding:36px 32px;border-left:3px solid var(--gold);background:var(--bg-lift);border:1px solid #1e1e1e;border-left:3px solid var(--gold);position:relative;text-align:left;}
.cosmo-quote::before{content:none;}
.cosmo-quote p{font-family:var(--serif);font-size:clamp(18px,2.5vw,24px);font-weight:300;font-style:italic;color:var(--white);line-height:1.75;margin-bottom:14px;}
.cosmo-quote cite{font-family:var(--sans);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-style:normal;opacity:.75;display:block;}

/* ── MIRROR / SYMPTOMS BLOCK ─────────────────────────────────────────────── */
.symptoms-block-box{max-width:660px;margin:0 auto;padding:44px 40px;border:1px solid #2a2a2a;background:var(--bg-lift);position:relative;}
.symptoms-block-box::before{content:'';position:absolute;top:-1px;left:-1px;width:20px;height:20px;border-top:1px solid var(--gold);border-left:1px solid var(--gold);}
.symptoms-block-box::after{content:'';position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold);}
.symptoms-block p{font-size:clamp(18px,2.8vw,28px);font-weight:300;color:var(--mid);line-height:1.75;margin-bottom:14px;}
.symptoms-block p.gold{color:var(--gold);font-style:italic;}
.symptoms-block .small{font-size:clamp(14px,1.8vw,17px);color:var(--grey);font-style:italic;line-height:1.9;}

/* ── VOID TEST ───────────────────────────────────────────────────────────── */
.void-test{padding:70px 24px;background:radial-gradient(ellipse at 50% 50%,rgba(212,175,55,.06) 0%,transparent 65%);border-top:1px solid #111;border-bottom:1px solid #111;}
.void-test-question{font-size:clamp(20px,3.2vw,32px);font-weight:300;color:var(--white);line-height:1.7;max-width:600px;margin:0 auto 36px;}
.void-test-question em{color:var(--gold);font-style:italic;}
.void-buttons{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:32px;}
.void-btn{padding:13px 40px;font-family:var(--sans);font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border:1px solid #444;background:transparent;color:var(--mid);transition:all .3s;}
.void-btn:hover,.void-btn.active{border-color:var(--gold);color:var(--gold);}
.void-response{max-width:540px;margin:0 auto;font-size:clamp(16px,2.2vw,20px);font-weight:300;color:var(--grey);line-height:1.9;display:none;padding:28px;border:1px solid #1e1e1e;background:var(--bg-lift);}
.void-response.visible{display:block;}
.void-response strong{color:var(--gold);font-weight:400;}

/* ── FRAMEWORK GRID ──────────────────────────────────────────────────────── */
.framework-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:2px;margin:48px auto 0;text-align:left;}
.framework-card{padding:38px 32px;background:var(--bg-lift);border:1px solid #1e1e1e;transition:border-color .3s;cursor:pointer;position:relative;}
.framework-card:hover{border-color:#333;}
.framework-content{overflow:hidden;transition:max-height .4s ease,opacity .3s ease;max-height:1200px;opacity:1;}
.framework-card.collapsed .framework-content{max-height:0;opacity:0;}
.framework-card .num{font-family:var(--sans);font-size:10px;letter-spacing:3px;color:var(--gold);opacity:.7;margin-bottom:18px;display:block;}
.framework-card h3{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--white);margin-bottom:12px;line-height:1.4;}
.framework-card p{font-family:var(--serif);font-size:16.5px;font-weight:300;color:var(--grey);line-height:1.88;}
.framework-card::after{content:'Collapse ▲';position:absolute;top:32px;right:28px;font-size:10px;font-family:var(--sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);opacity:.7;transition:all .3s;}
.framework-card.collapsed::after{content:'Expand ▼';}

/* ── 5 PILLARS ───────────────────────────────────────────────────────────── */
.astrolabe-section{padding:90px 24px;background:radial-gradient(ellipse at 50% 100%,rgba(212,175,55,.06) 0%,transparent 60%);border-top:1px solid #111;border-bottom:1px solid #111;}
.astrolabe-section h2{font-size:clamp(22px,3.5vw,38px);font-weight:300;color:var(--white);max-width:660px;margin:0 auto 16px;line-height:1.5;}
.astrolabe-section .sub{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:520px;margin:0 auto 52px;font-style:italic;line-height:1.85;}
.pillar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;max-width:980px;margin:0 auto 44px;text-align:left;}
.pillar-card{padding:32px 28px;background:var(--bg-lift);border:1px solid #1e1e1e;cursor:pointer;transition:border-color .3s;}
.pillar-card:hover{border-color:#444;}
.pillar-card.open{border-color:var(--gold);}
.pillar-card .p-num{font-family:var(--sans);font-size:10px;letter-spacing:3px;color:var(--gold);opacity:.65;margin-bottom:10px;display:block;}
.pillar-card .p-title{font-family:var(--serif);font-size:21px;font-weight:400;color:var(--white);margin-bottom:0;line-height:1.35;}
.pillar-card .p-expand{font-family:var(--sans);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-top:8px;display:block;}
.pillar-card .p-body{font-family:var(--serif);font-size:15.5px;font-weight:300;color:var(--grey);line-height:1.88;margin-top:16px;display:none;border-top:1px solid #1e1e1e;padding-top:16px;}
.pillar-card.open .p-body{display:block;}
.astrolabe-cta{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:500px;margin:0 auto;font-style:italic;line-height:1.85;}

/* ── TWO PATHS ───────────────────────────────────────────────────────────── */
.two-paths{padding:90px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.two-paths h2{font-size:clamp(22px,3.5vw,36px);font-weight:300;color:var(--white);max-width:620px;margin:0 auto 16px;line-height:1.5;}
.two-paths .sub{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:520px;margin:0 auto 52px;line-height:1.85;}
.paths-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-width:800px;margin:0 auto 44px;}
.path-card{padding:44px 36px;border:1px solid #1e1e1e;text-align:left;position:relative;}
.path-card.jnana{background:var(--bg);}
.path-card.bhakti{background:var(--bg-lift);}
.path-card .path-label{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);opacity:.65;margin-bottom:14px;display:block;}
.path-card h3{font-family:var(--serif);font-size:clamp(22px,3vw,30px);font-weight:400;color:var(--white);margin-bottom:16px;line-height:1.3;}
.path-card .path-sanskrit{font-family:var(--serif);font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:20px;font-style:italic;display:block;}
.path-card p{font-family:var(--serif);font-size:16px;font-weight:300;color:var(--grey);line-height:1.9;}
.paths-convergence{font-size:clamp(17px,2.5vw,22px);font-weight:300;font-style:italic;color:var(--mid);max-width:560px;margin:0 auto;line-height:1.8;}

/* ── COSMO BLOCK ─────────────────────────────────────────────────────────── */
.cosmo-block{padding:90px 24px;background:radial-gradient(ellipse at 50% 50%,rgba(212,175,55,.07) 0%,transparent 65%);border-top:1px solid #111;border-bottom:1px solid #111;}
.cosmo-block p{font-size:clamp(20px,3.5vw,34px);font-weight:300;font-style:italic;color:var(--gold);line-height:1.7;max-width:680px;margin:0 auto 22px;}
.cosmo-block .plain{font-style:normal;color:var(--grey);font-size:clamp(15px,2vw,20px);}

/* ── TRADITION TABLE ─────────────────────────────────────────────────────── */
.tradition-table{max-width:820px;margin:52px auto 0;border:1px solid #1e1e1e;overflow:hidden;}
.tradition-row{display:grid;grid-template-columns:1.2fr 1fr 1.5fr;border-bottom:1px solid #1a1a1a;}
.tradition-row:last-child{border-bottom:none;}
.tradition-row.header{background:#0a0a0a;}
.tradition-cell{font-family:var(--serif);font-size:clamp(14px,1.8vw,16px);font-weight:300;color:var(--grey);padding:18px 20px;text-align:left;border-right:1px solid #1a1a1a;}
.tradition-cell:last-child{border-right:none;}
.tradition-row.header .tradition-cell{font-family:var(--sans);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);padding:14px 20px;}
.tradition-cell.trad{color:var(--gold);font-style:italic;}

/* ── VISION SECTION ──────────────────────────────────────────────────────── */
.vision-section{padding:90px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.vision-box{max-width:720px;margin:0 auto;padding:60px 32px;border:1px solid #2a2a2a;background:radial-gradient(ellipse at 50% 50%,rgba(212,175,55,.05) 0%,transparent 70%);position:relative;}
.vision-statement{font-size:clamp(20px,3.5vw,32px);font-weight:300;color:var(--gold);line-height:1.8;margin-bottom:0;}
.vision-pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;text-align:left;margin-top:44px;}
.vision-pillar{border-left:2px solid var(--gold);padding-left:24px;}
.vision-pillar-tag{font-size:13px;font-weight:400;color:var(--gold);margin-bottom:10px;letter-spacing:1px;display:block;}
.vision-pillar p{font-size:17px;font-weight:300;color:var(--grey);line-height:1.85;}

/* ── COSMIC SECTION ──────────────────────────────────────────────────────── */
.cosmic-section{padding:90px 24px;max-width:680px;margin:0 auto;}
.cosmic-section p{font-size:clamp(16px,2.4vw,22px);font-weight:300;color:var(--mid);line-height:1.95;margin:16px 0;}
.cosmic-section p.gold{color:var(--gold);font-style:italic;font-size:clamp(18px,2.8vw,27px);}
.cosmic-section p.dim{color:var(--grey);font-size:clamp(14px,1.8vw,18px);}

/* ── IPO SECTION ─────────────────────────────────────────────────────────── */
.ipo-section{scroll-margin-top:56px;padding:90px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.07) 0%,transparent 60%);border-top:1px solid #111;border-bottom:1px solid #111;}
.ipo-headline{font-size:clamp(20px,3vw,32px);font-weight:300;color:var(--white);line-height:1.45;max-width:680px;margin:0 auto 16px;}
.ipo-headline em{font-style:italic;color:var(--gold);}
.ipo-sub{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:560px;margin:0 auto 52px;line-height:1.95;}
.ipo-table{max-width:680px;margin:0 auto 52px;border:2px solid #2a2a2a;overflow:hidden;}
.ipo-table,
[style*="overflow-x:auto"]{
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
}  
.ipo-table-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #1e1e1e;}
.ipo-table-row:last-child{border-bottom:none;}
.ipo-table-row.header{background:#0a0a0a;}
.ipo-table-row.header .ipo-cell{font-family:var(--sans);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);padding:16px 20px;border-right:1px solid #1e1e1e;}
.ipo-table-row.header .ipo-cell:last-child{border-right:none;}
.ipo-cell{font-family:var(--serif);font-size:clamp(14px,2vw,17px);font-weight:300;color:var(--grey);padding:20px;text-align:left;border-right:1px solid #1a1a1a;}
.ipo-cell:last-child{border-right:none;}
.ipo-cell.attr{color:var(--mid);font-family:var(--sans);font-size:11px;letter-spacing:1px;}
.ipo-cell.gold{color:var(--gold);}
.ipo-cell.bright{color:var(--white);font-weight:400;}
.ipo-upanishad{max-width:580px;margin:0 auto;font-size:clamp(15px,2.1vw,18px);font-family:var(--serif);color:var(--mid);letter-spacing:.4px;line-height:1.9;border:1px solid #1e1e1e;border-left:3px solid var(--gold);padding:32px 28px;background:var(--bg-lift);}
.ipo-upanishad strong{color:var(--gold);font-weight:500;font-family:var(--sans);font-size:12px;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:14px;}
.ipo-upanishad em{color:var(--gold);font-style:italic;font-weight:400;}

/* ── WHY SECTION ─────────────────────────────────────────────────────────── */
.why-section{padding:90px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.why-section h2{font-size:clamp(22px,3.5vw,38px);font-weight:300;color:var(--white);max-width:660px;margin:0 auto 52px;line-height:1.55;}
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:960px;margin:0 auto 52px;text-align:left;}
.why-card{padding:32px 28px;border:1px solid #1e1e1e;background:var(--bg);}
.why-card .icon{font-size:26px;margin-bottom:16px;display:block;}
.why-card h4{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--gold);margin-bottom:10px;}
.why-card p{font-family:var(--serif);font-size:16px;font-weight:300;color:var(--grey);line-height:1.88;}
.superordinate-box{max-width:680px;margin:0 auto 52px;padding:44px 36px;border:1px solid #2a2a2a;background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.06) 0%,transparent 60%);text-align:left;}
.superordinate-box .so-label{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);opacity:.65;margin-bottom:20px;display:block;}
.superordinate-box p{font-family:var(--serif);font-size:clamp(16px,2.2vw,20px);font-weight:300;color:var(--grey);line-height:1.9;margin-bottom:16px;}
.superordinate-box p.gold{color:var(--gold);font-style:italic;margin-bottom:0;}
.why-closing{max-width:600px;margin:0 auto;font-size:clamp(18px,2.5vw,24px);font-weight:300;font-style:italic;color:var(--white);line-height:1.8;}

/* ── WATCH ────────────────────────────────────────────────────────────────── */
.watch-section{padding:80px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.watch-links{display:flex;flex-direction:column;align-items:center;gap:32px;margin-top:42px;}
.watch-link-inner{display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px;}
.watch-thumb{width:100%;max-width:440px;height:220px;object-fit:cover;display:block;border:1px solid #2a2a2a;filter:brightness(0.85);transition:filter .3s;}
.watch-thumb:hover{filter:brightness(1);}
.watch-link{display:inline-flex;align-items:center;gap:12px;font-family:var(--sans);font-size:11.5px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;text-decoration:none;border:1px solid #2a2a2a;border-top:none;padding:15px 32px;transition:all .3s;width:100%;max-width:440px;justify-content:center;}
.watch-link:hover{border-color:var(--gold);background:var(--gold-dim);opacity:1;}
.watch-note{font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:8px;}

/* ── MIRROR ROOM ─────────────────────────────────────────────────────────── */
.mirror-room{scroll-margin-top:56px;padding:90px 24px;border-top:1px solid #111;}
.mirror-room h2{font-size:clamp(22px,3.5vw,36px);font-weight:300;color:var(--white);max-width:560px;margin:0 auto 20px;line-height:1.5;}
.mirror-room .descriptor{font-size:clamp(14px,2vw,19px);font-weight:300;color:var(--grey);max-width:520px;margin:0 auto 52px;line-height:1.92;}
.mirror-links{display:flex;flex-direction:column;align-items:center;gap:14px;}
.mirror-link{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border:1px solid #2a2a2a;padding:15px 40px;transition:all .3s;text-decoration:none;width:100%;max-width:380px;}
.mirror-link:hover{border-color:var(--gold);background:var(--gold-dim);opacity:1;}
.mirror-link.primary{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700;}
.mirror-link.primary:hover{opacity:.83;}

/* ── IDENTITY SECTION ────────────────────────────────────────────────────── */
.identity-section{padding:90px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.identity-section h2{font-size:clamp(22px,3.5vw,38px);font-weight:300;color:var(--white);max-width:660px;margin:0 auto 16px;line-height:1.5;}
.identity-section .sub{font-size:clamp(14px,2vw,19px);color:var(--grey);max-width:520px;margin:0 auto 52px;font-style:italic;line-height:1.85;}
.identity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:2px;max-width:980px;margin:0 auto;text-align:left;overflow:hidden;transition:max-height .5s ease,opacity .3s ease;max-height:3000px;opacity:1;}
.identity-section.collapsed .identity-grid{max-height:0;opacity:0;}
.identity-card{padding:38px 32px;background:var(--bg);border:1px solid #1e1e1e;transition:border-color .3s;}
.identity-card:hover{border-color:#333;}
.identity-card .layer-tag{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);opacity:.65;margin-bottom:14px;display:block;}
.identity-card h4{font-family:var(--serif);font-size:21px;font-weight:400;color:var(--white);margin-bottom:14px;line-height:1.35;}
.identity-card p{font-family:var(--serif);font-size:16px;font-weight:300;color:var(--grey);line-height:1.88;margin-bottom:16px;}
.identity-card .practice{font-family:var(--sans);font-size:12px;color:var(--gold);letter-spacing:.8px;border-top:1px solid #1e1e1e;padding-top:16px;line-height:1.7;opacity:.9;}

/* ── BRIDGE ───────────────────────────────────────────────────────────────── */
.bridge-section{padding:70px 24px;max-width:560px;margin:0 auto;}
.bridge-section p{font-size:clamp(17px,2.3vw,23px);font-weight:300;color:var(--mid);line-height:1.9;margin:16px 0;}
.bridge-section p.gold{color:var(--gold);font-style:italic;}

/* ── FAQ ─────────────────────────────────────────────────────────────────── */
.faq-section{padding:90px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.faq-section h2{font-size:clamp(20px,3vw,32px);font-weight:300;color:var(--white);max-width:560px;margin:0 auto 52px;line-height:1.5;}
.faq-list{max-width:680px;margin:0 auto;text-align:left;}
.faq-item{border-bottom:1px solid #1a1a1a;}
.faq-item:first-child{border-top:1px solid #1a1a1a;}
.faq-q{width:100%;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 4px;font-family:var(--serif);font-size:clamp(17px,2.2vw,21px);font-weight:400;color:var(--white);text-align:left;transition:color .25s;}
.faq-q:hover{color:var(--gold);}
.faq-icon{width:28px;height:28px;border-radius:50%;border:1px solid rgba(212,175,55,.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);font-size:18px;font-weight:300;line-height:1;transition:all .25s;font-family:var(--sans);}
.faq-item.open .faq-q .faq-icon{background:var(--gold);color:#000;border-color:var(--gold);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(0,1,.25,1);}
.faq-item.open .faq-a{max-height:900px;}
.faq-item.closed .faq-a{max-height:0;overflow:hidden;opacity:0;}
.faq-a-inner{padding:0 4px 28px;font-family:var(--serif);font-size:clamp(16px,2vw,19px);font-weight:300;color:var(--grey);line-height:1.95;}
.faq-a-inner a{color:var(--gold);}
.faq-a-inner strong{color:var(--mid);font-weight:400;}
.rrrr-version{margin-bottom:18px;padding:16px 18px;border:1px solid #1e1e1e;background:var(--bg);}
.rrrr-label{font-family:var(--sans);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:block;}
.rrrr-steps{font-size:clamp(16px,2vw,19px);color:var(--white);margin-bottom:8px;font-family:var(--serif);}
.rrrr-desc{font-size:clamp(14px,1.8vw,17px);color:var(--grey);line-height:1.8;}

/* ── CONTRACT ─────────────────────────────────────────────────────────────── */
.ca-full-section{scroll-margin-top:56px;padding:40px 24px 60px;max-width:680px;margin:0 auto;}
.ca-full-box{border:1px solid #2a2a2a;padding:36px 28px;background:var(--bg-lift);position:relative;}
.ca-full-box::before{content:'';position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:1px solid var(--gold);border-left:1px solid var(--gold);}
.ca-full-box::after{content:'';position:absolute;bottom:-1px;right:-1px;width:18px;height:18px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold);}
.ca-label{font-family:var(--sans);font-size:10px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;}
.ca-address-full{font-family:var(--sans);font-size:12px;color:#ddd;word-break:break-all;letter-spacing:1px;margin:12px 0;transition:color .3s;} [data-theme="light"] .ca-address-full{color:#1a1208 !important;}
.supply{font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:10px;}
.trade-links{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:20px;}
.trade-links a{font-family:var(--sans);font-size:11.5px;color:var(--mid);letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:color .25s;}
.trade-links a:hover{color:var(--gold);opacity:1;}

/* ── GO DEEPER ────────────────────────────────────────────────────────────── */
.explore-links{display:flex;justify-content:center;gap:20px 36px;flex-wrap:wrap;margin-top:28px;}
.explore-links a{font-family:var(--sans);font-size:11.5px;color:var(--mid);letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:color .25s;}
.explore-links a:hover{color:var(--gold);opacity:1;}

/* ── FOOTER ───────────────────────────────────────────────────────────────── */
.footer{padding:64px 24px 52px;border-top:1px solid #1a1a1a;}
.footer-logo-wrap{width:80px;height:80px;margin:0 auto 28px;border-radius:6px;overflow:hidden;box-shadow:0 0 16px 3px rgba(212,175,55,.25);background:#000;}
.footer-logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.footer-socials{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-bottom:28px;}
.footer-socials a{font-family:var(--sans);font-size:11px;color:var(--mid);letter-spacing:3px;text-transform:uppercase;text-decoration:none;transition:color .25s;}
.footer-socials a:hover{color:var(--gold);opacity:1;}
.footer-tagline{font-family:var(--sans);font-size:11px;color:var(--grey);letter-spacing:5px;text-transform:uppercase;margin-bottom:22px;}
.footer-ca{font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:.8px;word-break:break-all;max-width:500px;margin:0 auto;}

/* ── FARTCOIN SECTION ─────────────────────────────────────────────────────── */
.fartcoin-section{padding:90px 24px;border-top:1px solid #111;border-bottom:1px solid #111;background:var(--bg);}
.fartcoin-section .confrontation-label{font-family:var(--sans);font-size:9px;letter-spacing:5px;text-transform:uppercase;color:#c0392b;margin-bottom:40px;display:block;opacity:.9;}
.mc-compare{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-width:680px;margin:0 auto 52px;}
.mc-card{padding:32px 28px;border:1px solid #1e1e1e;text-align:left;}
.mc-card .mc-name{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-bottom:14px;display:block;}
.mc-card .mc-val{font-family:var(--sans);font-size:clamp(22px,4vw,40px);font-weight:300;line-height:1;margin-bottom:10px;}
.mc-card .mc-val.joke{color:#888;}
.mc-card .mc-val.self{color:var(--gold);}
.mc-card .mc-desc{font-family:var(--serif);font-size:15px;font-weight:300;color:var(--grey);line-height:1.8;}

/* ── SURRENDER SECTION ────────────────────────────────────────────────────── */
.surrender-section{margin-top:52px;max-width:760px;margin-left:auto;margin-right:auto;text-align:left;}
.surrender-section h4{font-family:var(--serif);font-size:clamp(20px,2.8vw,28px);font-weight:300;color:var(--white);margin-bottom:8px;text-align:center;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;gap:16px;}
.surrender-section .surrender-sub{font-family:var(--serif);font-size:clamp(13px,1.8vw,16px);color:var(--grey);font-style:italic;text-align:center;margin-bottom:40px;line-height:1.8;}
.stage-expand-label{font-family:var(--sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.8;padding:4px 10px;border:1px solid #2a2a2a;transition:all .25s;}
.surrender-section h4:hover .stage-expand-label{border-color:var(--gold);}
.surrender-content{overflow:hidden;transition:max-height .5s ease,opacity .3s ease;max-height:3000px;opacity:1;}
.surrender-section.collapsed .surrender-content{max-height:0;opacity:0;}
.stage-item{display:grid;grid-template-columns:52px 1fr;gap:0;margin-bottom:2px;border:1px solid #1e1e1e;background:var(--bg);}
.stage-num-col{padding:24px 16px;border-right:1px solid #1e1e1e;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:26px;}
.stage-num-col .s-n{font-family:var(--sans);font-size:10px;letter-spacing:2px;color:var(--gold);opacity:.65;text-transform:uppercase;}
.stage-body-col{padding:22px 24px;}
.stage-body-col .s-title{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--white);margin-bottom:4px;}
.stage-body-col .s-sub{font-family:var(--sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:block;}
.stage-body-col .s-text{font-family:var(--serif);font-size:15.5px;font-weight:300;color:var(--grey);line-height:1.85;}
.surrender-arrow{text-align:center;padding:8px 0;color:var(--gold);opacity:.3;font-size:18px;display:block;}

/* ── ARCHITECTURE OF EGO ─────────────────────────────────────────────────── */
.ego-arch-section{padding:90px 24px;background:var(--bg);border-top:1px solid #111;border-bottom:1px solid #111;}
.ego-arch-section h2{font-size:clamp(22px,3.5vw,38px);font-weight:300;color:var(--white);max-width:700px;margin:0 auto 16px;line-height:1.5;}
.ego-arch-section .sub{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:560px;margin:0 auto 52px;font-style:italic;line-height:1.85;}
.ego-ring-wrap{max-width:700px;margin:0 auto 52px;padding:44px 36px;border:1px solid #2a2a2a;background:radial-gradient(ellipse at 50% 50%,rgba(212,175,55,.04) 0%,transparent 70%);}
.ego-ring-title{font-family:var(--sans);font-size:9px;letter-spacing:5px;text-transform:uppercase;color:#c0392b;opacity:.85;margin-bottom:24px;display:block;}
.ego-twin{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:32px;}
.ego-twin-card{padding:28px 24px;border:1px solid #1e1e1e;text-align:left;}
.ego-twin-card.attachment{background:rgba(212,175,55,.03);}
.ego-twin-card.aversion{background:rgba(192,57,43,.03);}
.ego-twin-card .tc-label{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;margin-bottom:12px;display:block;}
.ego-twin-card.attachment .tc-label{color:var(--gold);}
.ego-twin-card.aversion .tc-label{color:#c0392b;}
.ego-twin-card h4{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--white);margin-bottom:14px;}
.ego-twin-card p{font-family:var(--serif);font-size:15px;font-weight:300;color:var(--grey);line-height:1.85;margin-bottom:10px;}
.ego-twin-card .tc-end{font-family:var(--sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding-top:10px;border-top:1px solid #1a1a1a;}

/* ── EGO SUB-SECTION HEADERS — properly aligned ──────────────────────────── */
.ego-sub-header{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;
  max-width:820px;margin:0 auto 8px;text-align:left;
}
.ego-sub-header-text{text-align:left;}
.ego-sub-header-text h3{font-family:var(--serif);font-size:clamp(20px,2.8vw,28px);font-weight:300;color:var(--white);margin-bottom:4px;}
.ego-sub-header-text p{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);}

.sl-stage{padding:22px 16px;border:1px solid #1e1e1e;text-align:left;background:var(--bg-lift);position:relative;}
.sl-num{font-family:var(--sans);font-size:9px;letter-spacing:3px;color:var(--gold);opacity:.6;margin-bottom:8px;display:block;}
.sl-name{font-family:var(--serif);font-size:17px;color:var(--white);margin-bottom:6px;}
.sl-desc{font-family:var(--serif);font-size:13px;font-weight:300;color:var(--grey);line-height:1.8;}
.sl-stage.danger{border-color:#3a1010;}
.sl-stage.danger .sl-num{color:#c0392b;opacity:.8;}

/* ── ENNEAGRAM SECTION ───────────────────────────────────────────────────── */
.enn-section{padding:90px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.enn-section h2{font-size:clamp(22px,3.5vw,38px);font-weight:300;color:var(--white);max-width:700px;margin:0 auto 16px;line-height:1.5;}
.enn-section .sub{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:580px;margin:0 auto 52px;font-style:italic;line-height:1.85;}
.enn-intro-box{max-width:720px;margin:0 auto 52px;padding:36px 32px;border:1px solid #2a2a2a;background:var(--bg);text-align:left;}
.enn-intro-box p{font-family:var(--serif);font-size:clamp(16px,2.1vw,19px);color:var(--grey);line-height:1.9;margin-bottom:14px;}
.enn-intro-box p:last-child{margin-bottom:0;}
.enn-intro-box p.highlight{color:var(--white);}
.enn-intro-box p.gold{color:var(--gold);font-style:italic;}
.enn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;max-width:980px;margin:0 auto 52px;text-align:left;}
.enneagram-card{padding:32px 28px;background:var(--bg);border:1px solid #1e1e1e;cursor:pointer;transition:border-color .3s;}
.enneagram-card:hover{border-color:#444;}
.enneagram-card.open{border-color:var(--gold);}
.enneagram-card .ec-type{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:block;}
.enneagram-card .ec-name{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--white);margin-bottom:4px;}
.enneagram-card .ec-fear{font-family:var(--sans);font-size:10px;letter-spacing:1px;color:var(--grey);margin-bottom:12px;}
.enneagram-card .ec-toggle{font-family:var(--sans);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-top:8px;display:block;}
.enneagram-card .ec-body{display:none;border-top:1px solid #1e1e1e;margin-top:14px;padding-top:14px;}
.enneagram-card.open .ec-body{display:block;}
.ec-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}

/* ── DESCENT SECTION ─────────────────────────────────────────────────────── */
.descent-section{padding:90px 24px;background:var(--bg);border-top:1px solid #111;border-bottom:1px solid #111;}
.descent-section h2{font-size:clamp(22px,3.5vw,36px);font-weight:300;color:var(--white);max-width:680px;margin:0 auto 16px;line-height:1.5;}
.descent-section .sub{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:540px;margin:0 auto 52px;font-style:italic;line-height:1.85;}
.descent-funnel{max-width:600px;margin:0 auto 52px;}
.descent-step{padding:22px 28px;border:1px solid #1e1e1e;background:var(--bg-lift);margin-bottom:2px;display:grid;grid-template-columns:52px 1fr;gap:0;text-align:left;transition:border-color .3s;}
.descent-step:hover{border-color:#333;}
.descent-step.essence{border-color:var(--gold);background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.06) 0%,transparent 70%);}
.ds-num{font-family:var(--sans);font-size:10px;letter-spacing:2px;color:var(--gold);opacity:.6;padding-top:2px;}
.ds-num.danger{color:#c0392b;opacity:.8;}
.ds-title{font-family:var(--serif);font-size:19px;font-weight:400;color:var(--white);margin-bottom:4px;}
.ds-subtitle{font-family:var(--sans);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:block;}
.ds-text{font-family:var(--serif);font-size:14.5px;font-weight:300;color:var(--grey);line-height:1.85;}
.descent-step.essence .ds-title{color:var(--gold);}
.descent-arrow{text-align:center;font-size:16px;color:var(--gold);opacity:.25;padding:4px 0;}
.antidote-box{max-width:660px;margin:0 auto;padding:44px 36px;border:1px solid var(--gold);background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.06) 0%,transparent 65%);text-align:center;position:relative;}
.antidote-box::before{content:'';position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:1px solid var(--gold);border-left:1px solid var(--gold);}
.antidote-box::after{content:'';position:absolute;bottom:-1px;right:-1px;width:18px;height:18px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold);}
.antidote-box .ad-label{font-family:var(--sans);font-size:9px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);opacity:.75;margin-bottom:20px;display:block;}
.antidote-box h3{font-family:var(--serif);font-size:clamp(22px,3vw,30px);font-weight:300;color:var(--white);margin-bottom:20px;line-height:1.5;}
.antidote-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px;text-align:left;}
.antidote-step{padding:18px 16px;border:1px solid #2a2a2a;background:var(--bg);}
.as-num{font-family:var(--sans);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:6px;display:block;}
.as-title{font-family:var(--serif);font-size:17px;color:var(--white);margin-bottom:6px;}
.as-text{font-family:var(--serif);font-size:14px;color:var(--grey);line-height:1.8;}

/* ── RASA SYNTHESIS TABLE ────────────────────────────────────────────────── */
.rasa-section{padding:90px 24px;background:var(--bg-lift);border-top:1px solid #111;border-bottom:1px solid #111;}
.rasa-section h2{font-size:clamp(22px,3.5vw,36px);font-weight:300;color:var(--white);max-width:700px;margin:0 auto 16px;line-height:1.5;}
.rasa-section .sub{font-size:clamp(15px,2vw,19px);color:var(--grey);max-width:560px;margin:0 auto 52px;font-style:italic;line-height:1.85;}

.rasa-cell{font-family:var(--serif);font-size:clamp(13px,1.7vw,15px);font-weight:300;color:var(--grey);padding:16px 18px;text-align:left;border-right:1px solid #1a1a1a;}

.rasa-cell.shadow{color:#c0392b;opacity:.85;font-style:italic;}
.rasa-cell.light{color:var(--gold);}
.rasa-row:nth-child(odd):not(.header){background:rgba(255,255,255,.004);}
.rasa-closing{max-width:680px;margin:36px auto 0;padding:32px 28px;border:1px solid #1e1e1e;border-left:3px solid var(--gold);background:var(--bg);text-align:left;}

    /* touch-action allows horizontal swipe ONLY inside this element */
    touch-action:pan-x pan-y !important;
    /* Keep left/right border since we're not full-bleeding anymore */
    border-left:1px solid #1e1e1e !important;

  }
 
  /* The section parents of tables MUST use overflow-x:hidden
     (not visible, not auto) so they don't become scroll containers
     themselves, which would interfere with body scroll */
  section:has(.self-table-wrap){
    overflow-x:hidden !important;
  }
 
  /* Fallback for browsers that don't support :has() —
     the sections with tables already have overflow:visible in doc3,
     change to hidden for containment */
  .self-table-wrap + * { clear:both; }

/* The existing html{overflow-x:hidden} in doc3 causes iOS scroll jitter */
/* We override it for mobile — body handles horizontal overflow containment */
@media(max-width:900px){
  html{
    /* Remove overflow-x:hidden from html on mobile — iOS needs html scrollable */
    overflow-x:visible !important;
    /* Remove webkit overflow scrolling from html — body handles this */
    -webkit-overflow-scrolling:auto !important;
  }
 
  body {
    overscroll-behavior: auto !important;
  }
}
 
/* Force nav to not create a new stacking context on Android */
@media(max-width:900px){
  .site-nav {
    transform: none !important;
    -webkit-transform: none !important;
    isolation: auto !important;
  }
}
 
  /* Light theme solid nav on mobile */
  [data-theme="light"] .site-nav{
    background:rgba(250,248,243,0.99) !important;
  }
}
 
/* ── Progress bar: requestAnimationFrame is the correct fix for scroll perf ──
   The progress bar width update via JS .style.width on scroll can cause
   layout thrashing. We can't fix the JS here, but we can prevent the
   bar from triggering repaints by using transform instead of width.
   This is a CSS hint: contain the progress bar's paint area. */
.progress-bar {
  contain: none !important;      /* remove — causes layer conflicts on Android */
  will-change: auto !important;  /* remove GPU hint — let browser decide */
  transform: none !important;    /* remove — JS uses width, not transform */
  transition: none !important;
}
 @media(max-width:900px){
  .self-table-wrap::-webkit-scrollbar{
    height:2px;
    background:transparent;
  }
  .self-table-wrap::-webkit-scrollbar-thumb{
    background:rgba(212,175,55,0.5);
    border-radius:1px;
  }
  [data-theme="light"] .self-table-wrap::-webkit-scrollbar-thumb{
    background:rgba(122,94,14,0.5);
  }

  }
  [data-theme="light"] .rasa-table::-webkit-scrollbar-thumb{
    background:rgba(122,94,14,0.5);
  }
}
